name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]   # ggf. auf 'main' anpassen, falls dein Hauptbranch so heißt

permissions:
  contents: write          # erlaubt der Action, in den gh-pages-Branch zu pushen

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'   # EmineoBlazor zielt auf net10.0

    - name: Publish Project
      run: dotnet publish EmineoBlazor/EmineoBlazor.csproj -c Release -o release

    - name: Add .nojekyll
      run: touch release/wwwroot/.nojekyll

    - name: Ensure base-tag in index.html is '/'
      run: |
        sed -i 's|<base href="[^"]*"|<base href="/"|g' release/wwwroot/index.html
        echo "--- base tag after replacement ---"
        grep -o '<base href="[^"]*"' release/wwwroot/index.html

    - name: Copy index.html to 404.html for SPA routing
      run: cp release/wwwroot/index.html release/wwwroot/404.html

    - name: Deploy to gh-pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: release/wwwroot
        branch: gh-pages